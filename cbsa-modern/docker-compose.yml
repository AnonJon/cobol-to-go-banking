services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbsa
      POSTGRES_USER: cbsa
      POSTGRES_PASSWORD: cbsa_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cbsa:cbsa_secret@postgres:5432/cbsa?sslmode=disable
      PORT: "8080"
      SORT_CODE: "987654"
      COMPANY_NAME: "CICS Bank Sample Application"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
